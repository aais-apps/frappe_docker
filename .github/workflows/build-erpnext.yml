name: Build & Publish ERPNext Image

on:
  push:
    branches:
      - production
    paths:
      - 'images/production/**'
      - 'resources/core/**'
      - '.github/workflows/build-erpnext.yml'
  workflow_dispatch:
    inputs:
      frappe_branch:
        description: 'Frappe Git Branch'
        required: true
        default: 'production'
      erpnext_branch:
        description: 'ERPNext Git Branch'
        required: true
        default: 'production'
      push:
        description: 'Push to GHCR'
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Push ERPNext Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frappe_docker
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/aais-apps/erpnext
            ghcr.io/aais-apps/erp
          tags: |
            type=raw,value=latest
            type=raw,value=production
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/production/Containerfile
          target: erpnext
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FRAPPE_PATH=https://github.com/aais-apps/frappe.git
            FRAPPE_BRANCH=${{ inputs.frappe_branch || 'production' }}
            ERPNEXT_REPO=https://github.com/aais-apps/erpnext.git
            ERPNEXT_BRANCH=${{ inputs.erpnext_branch || 'production' }}
            EDUCATION_REPO=https://github.com/aais-apps/education.git
            EDUCATION_BRANCH=production
          cache-from: type=gha
          cache-to: type=gha,mode=max
