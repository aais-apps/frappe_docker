name: Tested AAIS release

on:
  push:
    branches: [production]
    paths: ['images/production/**', 'resources/core/**', 'deployment/aais/**', '.github/workflows/build-erpnext.yml']
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
concurrency:
  group: aais-production-release
  cancel-in-progress: false
jobs:
  release:
    name: Build, install, migrate and test
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable application revisions
        id: sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 deployment/aais/ops/resolve-release.py
      - name: Check whether this exact release was already tested
        id: check
        env:
          RELEASE_ID: ${{ steps.sources.outputs.release_id }}
        run: |
          if docker buildx imagetools inspect "ghcr.io/aais-apps/erpnext:release-$RELEASE_ID" >/dev/null 2>&1; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build candidate locally
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/production/Containerfile
          target: erpnext
          load: true
          tags: local/aais:candidate
          cache-from: type=gha,scope=aais-production
          cache-to: type=gha,mode=max,scope=aais-production
          build-args: |
            FRAPPE_PATH=https://github.com/aais-apps/frappe.git
            FRAPPE_BRANCH=production
            ERPNEXT_REPO=https://github.com/aais-apps/erpnext.git
            ERPNEXT_BRANCH=production
            EDUCATION_BRANCH=production
            BUILDER_BRANCH=production
            FRAPPE_REVISION=${{ steps.sources.outputs.frappe }}
            ERPNEXT_REVISION=${{ steps.sources.outputs.erpnext }}
            EDUCATION_REVISION=${{ steps.sources.outputs.education }}
            BUILDER_REVISION=${{ steps.sources.outputs.builder }}
          labels: |
            org.opencontainers.image.source=https://github.com/aais-apps/frappe_docker
            org.opencontainers.image.revision=${{ github.sha }}
            io.aais.release=${{ steps.sources.outputs.release_id }}
      - name: Install all apps, migrate a new database and verify HTTP health
        if: steps.check.outputs.build == 'true'
        run: bash deployment/aais/ops/test-image.sh local/aais:candidate
      - name: Publish the tested image
        if: steps.check.outputs.build == 'true'
        env:
          RELEASE_ID: ${{ steps.sources.outputs.release_id }}
        run: |
          for repo in erpnext erp; do
            for tag in "release-$RELEASE_ID" production latest; do
              docker tag local/aais:candidate "ghcr.io/aais-apps/$repo:$tag"
              docker push "ghcr.io/aais-apps/$repo:$tag"
            done
          done
      - name: Record the release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release.json
